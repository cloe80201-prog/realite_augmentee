<!doctype HTML>
<html>
<head>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script>
        AFRAME.registerComponent('play-on-scan',{
            init: function () {
                var el = this.el;
                var music = document.getElementById("audio");
                el.sceneEl.addEventListener('markerFound', function () {
                        if (music.paused) {
                            music.play();
                        }
                });
                el.sceneEl.addEventListener('markerLost', function () {
                        if (!music.paused) {
                            music.pause();
                        }
                });
            }
        });
    </script>
</head>
<body style='margin : 0px; overflow: hidden;'>
    <audio src="musique/PARANO.mp3" style="display: none;" id="audio"></audio>

    <a-assets>
            <img id="card" src="image/robot.png" />
            <a-asset-item id="gltf-asset" src="./assets/CesiumMan.gltf"></a-asset-item>
        </a-assets>

</body>

</html>
